<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Attendance</title>
<style>
body{font-family:Arial;background:#f0fdf4;padding:25px}
main{max-width:650px;margin:auto;background:white;padding:30px;border-radius:16px}
input[type=text]{width:65%;padding:12px;box-sizing:border-box;border:1px solid #86efac;border-radius:8px}
button{background:#15803d;color:white;padding:12px;border:0;border-radius:7px;cursor:pointer}
.student{display:flex;align-items:center;gap:10px;background:#dcfce7;padding:15px;margin-top:10px;border-radius:8px}
.student span{flex:1;overflow-wrap:anywhere}
select{padding:8px}
</style>
</head>
<body>
<main>
<h1>Student Attendance</h1>
<p>Manage your classroom attendance easily.</p>
<input id="name" type="text" placeholder="Student name">
<button onclick="addStudent()">Add Student</button>
<h3 id="summary"></h3>
<div id="students"></div>
</main>
<script>
let students=JSON.parse(localStorage.getItem("students")||"[]");
function save(){
 localStorage.setItem("students",JSON.stringify(students));
 render();
}
function addStudent(){
 const name=document.getElementById("name");
 if(!name.value.trim())return;
 students.push({name:name.value.trim(),status:"Pending"});
 name.value="";
 save();
}
function render(){
 const list=document.getElementById("students");
 list.innerHTML="";
 students.forEach((student,i)=>{
  const row=document.createElement("div");
  row.className="student";
  const name=document.createElement("span");
  name.textContent=student.name;
  const select=document.createElement("select");
  ["Pending","Present","Absent"].forEach(status=>{
   const option=document.createElement("option");
   option.value=status;
   option.textContent=status;
   select.appendChild(option);
  });
  select.value=student.status;
  select.onchange=()=>{
   students[i].status=select.value;
   save();
  };
  const btn=document.createElement("button");
  btn.textContent="Delete";
  btn.onclick=()=>{
   students.splice(i,1);
   save();
  };
  row.append(name,select,btn);
  list.appendChild(row);
 });
 const present=students.filter(s=>s.status==="Present").length;
 const absent=students.filter(s=>s.status==="Absent").length;
 document.getElementById("summary").textContent=
 "Total: "+students.length+" | Present: "+present+" | Absent: "+absent;
}
render();
</script>
</body>
</html>
