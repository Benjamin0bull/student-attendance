<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Student Attendance</title>
<style>
body{font-family:Arial;background:#eff6ff;padding:25px}
main{max-width:600px;margin:auto;background:white;padding:25px;border-radius:15px}
input{padding:12px;width:70%;border:1px solid #93c5fd;border-radius:7px}
button{padding:11px;background:#2563eb;color:white;border:0;border-radius:7px;cursor:pointer}
.student{display:flex;justify-content:space-between;align-items:center;background:#dbeafe;padding:12px;margin:8px 0;border-radius:8px;gap:8px}
.summary{background:#eff6ff;padding:15px;margin-top:15px;border-radius:8px}
</style>
</head>
<body>
<main>
<h1>Student Attendance</h1>
<input id="name" placeholder="Student name">
<button onclick="addStudent()">Add</button>
<div id="students"></div>
<div class="summary" id="summary"></div>
</main>
<script>
let students=JSON.parse(localStorage.getItem("attendanceStudents")||"[]");
function save(){
 localStorage.setItem("attendanceStudents",JSON.stringify(students));
 render();
}
function addStudent(){
 const field=document.getElementById("name");
 const name=field.value.trim();
 if(!name)return;
 if(students.some(s=>s.name.toLowerCase()===name.toLowerCase())){
  alert("This student already exists.");
  return;
 }
 students.push({name,present:false});
 field.value="";
 save();
}
function render(){
 const list=document.getElementById("students");
 list.innerHTML="";
 students.forEach((s,i)=>{
  const row=document.createElement("div");
  row.className="student";
  const label=document.createElement("span");
  label.textContent=s.name;
  const toggle=document.createElement("button");
  toggle.textContent=s.present?"Present":"Absent";
  toggle.style.background=s.present?"#16a34a":"#64748b";
  toggle.onclick=()=>{students[i].present=!students[i].present;save();};
  const del=document.createElement("button");
  del.textContent="X";
  del.onclick=()=>{students.splice(i,1);save();};
  row.append(label,toggle,del);
  list.appendChild(row);
 });
 const present=students.filter(s=>s.present).length;
 document.getElementById("summary").textContent=
 "Total: "+students.length+" | Present: "+present+
 " | Absent: "+(students.length-present);
}
render();
</script>
</body>
</html>
